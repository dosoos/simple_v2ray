services:

  panel:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # 配置文件, 可以编辑租户信息
      - ./v2ray:/v2ray
      # 供面板内「重启 V2Ray」调用 docker（等同宿主机执行 docker restart，请确保仅信任可登入面板的用户）
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  v2ray:
    image: v2fly/v2fly-core:latest
    restart: unless-stopped
    volumes:
      - ./v2ray:/etc/v2ray
    command: run -c /etc/v2ray/config.json
    depends_on:
      - panel
    networks:
      - internal

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - panel
      - v2ray
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
