## 扩展字段（仅用于 YAML anchor 复用），不能放在 services 下
x-app-env: &app_env
  HOST_DOMAIN: ${HOST_DOMAIN:-localhost}
  V2RAY_CONFIG_PATH: /v2ray/config.json
  # 与 Caddy Basic Auth 用户名一致（面板右上角展示）
  CADDY_ADMIN_USER: ${CADDY_ADMIN_USER:-admin}

services:

  panel:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment: *app_env
    volumes:
      - ./v2ray:/v2ray
      # 供面板内「重启 V2Ray」调用 docker（等同宿主机执行 docker restart，请确保仅信任可登入面板的用户）
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  v2ray:
    image: v2fly/v2fly-core:latest
    restart: unless-stopped
    volumes:
      - ./v2ray:/etc/v2ray
    command: run -c /etc/v2ray/config.json
    depends_on:
      - panel
    networks:
      - internal

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    entrypoint: ["/bin/sh", "-c"]
    # Caddy 要求多站点地址中逗号后须有空格；将 a.com,b.com 规范为 a.com, b.com
    command:
      - |
        export HOST_DOMAIN_SITES="$$(echo "$$HOST_DOMAIN" | tr '，' ',' | sed 's/, */, /g')"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      HOST_DOMAIN: ${HOST_DOMAIN:-localhost}
      CADDY_ADMIN_USER: ${CADDY_ADMIN_USER:-admin}
      # 未设置时默认使用密码 changeme 的 bcrypt（仅方便本地试跑，生产务必覆盖）
      CADDY_ADMIN_HASH: ${CADDY_ADMIN_HASH:-$$2a$$14$$XHY.OgJFoWOvzYTiUycXw.wARMwegkwAOh2JE4.EJ9hbtCZ7nJXVu}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - panel
      - v2ray
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
